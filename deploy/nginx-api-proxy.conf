# Add this block inside the frontend server { ... } block, before location /.
# It keeps session cookies first-party by proxying browser API calls through the frontend origin.
location ^~ /api/ {
    proxy_pass http://3.34.62.133;
    proxy_http_version 1.1;

    proxy_set_header Host 3.34.62.133;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

