# Add this block inside the frontend server { ... } block, before location /.
# It keeps session cookies first-party by proxying browser API calls through the frontend origin.
location ^~ /api/ {
    # Profile media accepts files up to 3 MiB; leave room for multipart overhead.
    client_max_body_size 4m;

    proxy_pass http://3.34.62.133;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cookie_domain 3.34.62.133 $host;
    proxy_cookie_path ~*^/.* /;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

